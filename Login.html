<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="assets.css">
</head>
<body>
    <div class="modal-overlay" style="display: flex;">
        <div class="modal-content fade-in">
            <h2>Sign In</h2>
            <p style="color: #9ca3af; margin-bottom: 1rem;">Demo: super1 / super123</p>
            <form id="login-form">
                <input id="username" placeholder="Username" required />
                <input id="password" type="password" placeholder="Password" required />
                <button type="submit" class="btn w-full">Login</button>
            </form>
            <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #374151;">
                <button id="register-btn" class="btn secondary w-full">Register New Account</button>
            </div>
        </div>
    </div>

    <div id="register-modal" class="modal-overlay">
        <div class="modal-content fade-in">
            <h2>Create Account</h2>
            <form id="register-form">
                <div class="flex">
                    <select id="reg-role">
                        <option value="resident">Citizen</option>
                        <option value="worker">Worker</option>
                    </select>
                </div>
                <input id="reg-username" placeholder="Username" required />
                <input id="reg-password" type="password" placeholder="Password" required />
                <input id="reg-name" placeholder="Full Name" required />
                <div class="flex">
                    <input id="reg-phone" placeholder="Phone" />
                    <input id="reg-email" placeholder="Email" />
                </div>
                <input id="reg-address" placeholder="Address" />
                
                <div class="flex" style="margin-top: 1rem;">
                    <button type="submit" class="btn w-full">Submit</button>
                    <button type="button" id="register-close-btn" class="btn secondary w-full">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="assets.js"></script>
</body>
</html>
